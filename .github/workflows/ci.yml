name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: core-v1-md
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core-v1-md/requirements.txt

      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Headless render
        run: python -m simulator --headless --frames 180 --launch Cyberpunk2077.exe --screenshot render/core-v1-md-${{ matrix.os }}.png

      - name: Render UI proof-of-concept gallery
        run: python -m simulator.pocs --out render/poc

      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.os }}
          path: core-v1-md/render/
          if-no-files-found: error
