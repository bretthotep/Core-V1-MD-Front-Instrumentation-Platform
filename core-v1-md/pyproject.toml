[project]
name = "core-v1-md"
version = "0.1.0"
description = "Sony MiniDisc-inspired front-panel instrumentation platform for the Thermaltake Core V1."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B", "I"]
