[project]
name = "core-v1-md"
version = "0.1.0"
description = "Sony MiniDisc-inspired front-panel instrumentation platform for the Thermaltake Core V1."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
